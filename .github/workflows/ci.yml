name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Read-only token: this workflow only builds and checks the code.
permissions:
  contents: read

# Supersede in-flight runs for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, lint and type-check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: pcf/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix pcf

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      # The solution source, on every pull request rather than only on a release.
      # The mistakes this catches are the ones SolutionPackager stays silent
      # about — a table no RootComponent mentions, a non-empty <Entities /> that
      # makes the packer drop the folder — and finding them on the tag is finding
      # them too late. No dependencies, so it costs a second.
      - name: Check the solution source
        run: python3 .github/scripts/check-solution-source.py

      # The gapped-device bootstrap runs where nothing in this workflow can
      # reach it, so a syntax error in it costs a round trip to a real
      # environment to discover. Parsing is not running, but it is the half of
      # the problem that can be checked from here. PowerShell is preinstalled on
      # the runner.
      - name: Parse the Dataverse bootstrap script
        shell: pwsh
        run: |
          $script = "tools/powerplatform/Initialize-MentionEventSchema.ps1"
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script), [ref]$null, [ref]$errors)
          if ($errors) {
              foreach ($problem in $errors) {
                  Write-Host "::error file=$script,line=$($problem.Extent.StartLineNumber)::$($problem.Message)"
              }
              exit 1
          }
          Write-Host "$script parses"

      # The version contract: a four-part solution version, a three-part control
      # version, and nothing deriving one from the other. These run here rather
      # than only in the release workflow, because the release workflow is the
      # thing they are checking.
      - name: Check the version contract
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
