name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Read-only token: this workflow only builds and checks the code.
permissions:
  contents: read

# Supersede in-flight runs for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, lint and type-check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: pcf/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix pcf

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      # The solution source, on every pull request rather than only on a release.
      # The mistakes this catches are the ones SolutionPackager stays silent
      # about — a table no RootComponent mentions, a non-empty <Entities /> that
      # makes the packer drop the folder — and finding them on the tag is finding
      # them too late. No dependencies, so it costs a second.
      - name: Check the solution source
        run: python3 .github/scripts/check-solution-source.py

      # The event ledger's table source is derived from the real legacy export
      # by a committed script. Running it must reproduce exactly what is
      # committed: a hand edit to the generated XML, or a change to the
      # derivation that nobody regenerated, shows up here rather than in a
      # failed import.
      - name: Check the derived table source is what the generator produces
        run: |
          python3 tools/powerplatform/generate-mentionevent-entity.py
          git diff --exit-code -- powerplatform/src/Entities/ayonto_MentionEvent/Entity.xml

      # The ingest assembly's registration source, for the same reason and with a
      # sharper edge. Its three identifiers are pinned: a PluginAssemblyId that changed
      # makes the next import a different component rather than an update of this one,
      # and every registered step in every environment keeps pointing at the assembly
      # that is no longer there. A hand edit here, or a generator nobody re-ran, fails
      # in this step rather than in somebody's environment.
      - name: Check the plug-in registration source is what the generator produces
        run: |
          python3 tools/powerplatform/generate-mention-ingest-registration.py
          git diff --exit-code -- powerplatform/src/PluginAssemblies powerplatform/src/Other/Solution.xml

      # The version contract: a four-part solution version, a three-part control
      # version, and nothing deriving one from the other. These run here rather
      # than only in the release workflow, because the release workflow is the
      # thing they are checking.
      - name: Check the version contract
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v

  # The server-side ingest, built and tested on every pull request.
  #
  # A separate job on Windows, and the reason is the framework rather than a
  # preference. A Dataverse plug-in assembly has to target .NET Framework — the
  # sandbox runs nothing else — and .NET Framework has no runtime outside Windows,
  # so a net48 test assembly cannot execute on the Ubuntu runner the rest of this
  # workflow uses. `dotnet test` there asks for Mono and stops.
  #
  # The alternative was to test the same sources on a modern runtime, which would
  # mean taking the Dataverse SDK from a package whose dependency tree currently
  # carries a known high-severity advisory. Testing the assembly that actually
  # ships, on the framework it actually runs on, is worth one runner.
  server:
    name: Build and test the server ingest
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # Pinned to the same SDK the release workflow builds the solution with, so
      # that a compiler that moved cannot make the pull request and the release
      # two different builds.
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.401'

      # The test project references the plug-in project, so both are restored and
      # both are built. Nothing here contacts a Dataverse: everything the ingest
      # needs from the platform is behind an interface, and the fakes implement it.
      - name: Restore
        run: dotnet restore server/Ayonto.Mention.Ingest.Tests/Ayonto.Mention.Ingest.Tests.csproj

      - name: Build
        run: dotnet build server/Ayonto.Mention.Ingest.Tests/Ayonto.Mention.Ingest.Tests.csproj -c Release --no-restore

      - name: Test
        run: dotnet test server/Ayonto.Mention.Ingest.Tests/Ayonto.Mention.Ingest.Tests.csproj -c Release --no-build
