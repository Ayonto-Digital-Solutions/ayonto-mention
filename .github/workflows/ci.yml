name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Read-only token: this workflow only builds and checks the code.
permissions:
  contents: read

# Supersede in-flight runs for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, lint and type-check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: pcf/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix pcf

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck
