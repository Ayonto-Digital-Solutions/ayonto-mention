# Builds the Dataverse solution packages for a release, and publishes them only
# for a tag.
#
# Two ways in, on purpose. Started by hand it builds and checks the packages and
# leaves them as a workflow artifact, so they can be imported into a development
# environment and actually tried before anybody calls them a release. Started by
# a tag it does the same work and then publishes what it built. Nothing reaches
# a release page that was not built by this file from a tagged commit.
#
# The solution project IS in the repository, under powerplatform/. Until v1.0.2
# it was not: it was created here on every run with pac solution init, and it
# held nothing but the code component. That is precisely why every release up to
# v1.0.2 shipped without a database — a solution synthesised at build time can
# only carry what the workflow remembers to hand it.
#
# From v1.1.0 the source is checked in, so what ships is what can be read in the
# repository: the tables under powerplatform/src — ayonto_mention and
# ayonto_mentionevent — and the code component through the project reference in
# the cdsproj. This workflow only stamps the version and builds.
name: Release

on:
  # A pull request builds and checks the packages too. Packaging is where a
  # release goes wrong quietly — a component that fails to pack on Ubuntu, a
  # package that grew a file — and finding that out on the tag is finding it out
  # too late. Publishing stays impossible here: see the condition on the publish
  # job.
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      solution_version:
        description: "Solution version to build, four parts, for example 1.1.0.1"
        required: true
        type: string
  push:
    tags: ["v*"]

# Read-only by default. Only the publishing job asks for more, and only a tag
# ever runs it.
permissions:
  contents: read

env:
  # The checked-in solution project: the directory it lives in, and the name the
  # build gives its output. The project is called AyontoMentionSolution rather
  # than AyontoMention because a solution project may not share its name with a
  # component project it references.
  SOLUTION_DIR: powerplatform
  SOLUTION_PROJECT: AyontoMentionSolution
  SOLUTION_NAME: AyontoMention
  # The versions the packages were built and proved with. Raising one is a
  # deliberate change with a new proof, not something a runner does on its own.
  NODE_VERSION: "24.20.0"
  # The npm that ships inside that Node distribution. Named so a changed Node
  # build cannot bring a different npm along unnoticed; nothing installs it.
  NPM_VERSION: "11.19.0"
  DOTNET_VERSION: "10.0.401"
  PAC_VERSION: "2.12.1"

jobs:
  package:
    name: Build and check the solution packages
    runs-on: ubuntu-latest
    outputs:
      solution-version: ${{ steps.version.outputs.solution-version }}
      control-version: ${{ steps.version.outputs.control-version }}

    steps:
      - uses: actions/checkout@v7

      # Pinned, not floated. The candidate a release is validated from and the
      # package published against its tag are built weeks apart; a toolchain that
      # moved in between would make them two different things built from one
      # commit. These are the versions the packages were proved with.
      - uses: actions/setup-node@v7
        with:
          node-version: "24.20.0"
          cache: "npm"
          cache-dependency-path: pcf/package-lock.json

      # The pac CLI ships as a .NET tool, and the solution project is built with
      # dotnet.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.401"

      # Read through the environment and checked against a shape before it is
      # used anywhere else: it arrives from a tag name or from something typed
      # into a form, and everything downstream treats it as a version.
      # A run started by hand is a release candidate, and a candidate is cut from
      # the branch releases come from. Anywhere else it would be a package built
      # from unreviewed code carrying a real version number.
      - name: Check where a manual run was started from
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::a release candidate is built from main; this run is on ${GITHUB_REF}"
          exit 1

      # Two versions, worked out separately, because they are two different
      # things.
      #
      # A Dataverse solution version has four parts — major.minor.build.revision
      # — and the platform compares it to decide whether an import is an update
      # at all. The code component inside that solution carries a version of its
      # own, and the component framework manifest defines that one as Semantic
      # Versioning: three parts.
      #
      #   https://learn.microsoft.com/power-apps/maker/data-platform/update-solutions
      #   https://learn.microsoft.com/power-apps/developer/component-framework/manifest-schema-reference/control
      #
      # Neither is computed from the other. This used to name one three-part
      # number and append `.0` to reach a solution version, which held only while
      # the two moved together — and they do not. The solution can need a
      # fourth-part revision on its own, for a table or a step or a security
      # role, with the control untouched.
      #
      # Where each value comes from is not the same as who decides it. Both
      # versions are declared in the repository; a tag and a dispatch input only
      # *name* a release, and the next step is what holds them to the committed
      # manifest. A tag pushed at a commit whose manifest still says something
      # else stops the build rather than getting stamped into it.
      #
      # One branch per event, spelled out. A fallback chain would quietly pick
      # something for an event nobody thought about, and the solution version is
      # the name the package goes out under.
      - name: Work out the versions
        id: version
        env:
          INPUT_SOLUTION_VERSION: ${{ inputs.solution_version }}
        run: |
          case "${GITHUB_EVENT_NAME}" in
            workflow_dispatch)
              solution_version="${INPUT_SOLUTION_VERSION}" ;;
            push)
              # A tag names the release, and a release is named by its solution
              # version: v1.1.0.1, not v1.1.0. A three-part tag is not padded
              # into a solution version — it fails the shape check below, and a
              # four-part tag that disagrees with the committed manifest fails
              # the next step.
              solution_version="${GITHUB_REF_NAME#v}" ;;
            pull_request)
              # What the repository itself says it is: a pull request builds the
              # packages to prove they build, not to name a release. This is the
              # same file every other event is checked against.
              solution_version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' \
                "${SOLUTION_DIR}/src/Other/Solution.xml" | head -1) ;;
            *)
              echo "::error::${GITHUB_EVENT_NAME} does not say what version to build"
              exit 1 ;;
          esac

          # The control version is never named from outside, whatever the event.
          # It is committed, in three files that have to agree, and the next step
          # is what proves they do.
          control_version=$(node -p "require('./package.json').version")

          # Shapes checked before either value reaches a filename or a manifest.
          # Anchored and digits only: a version that merely begins with the right
          # shape is not the right shape.
          if ! printf '%s' "${solution_version}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::expected a four-part solution version like 1.1.0.1, got '${solution_version}'"
            exit 1
          fi
          if ! printf '%s' "${control_version}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::expected a three-part control version like 1.1.0, got '${control_version}'"
            exit 1
          fi

          echo "solution-version=${solution_version}" >> "$GITHUB_OUTPUT"
          echo "control-version=${control_version}" >> "$GITHUB_OUTPUT"
          echo "Building ${SOLUTION_NAME} solution ${solution_version}, control ${control_version}"

      # What the repository says it is, against what the release says it is —
      # and the repository is what counts. Four declarations are read here: the
      # solution version in the committed manifest, and the control version in
      # the three files that carry it.
      #
      # This is the step that makes a tag an assertion rather than a decision. A
      # release ships what was reviewed and merged; raising either version is a
      # pull request, not a number typed into a form.
      - name: Check the version declarations agree
        env:
          SOLUTION_VERSION: ${{ steps.version.outputs.solution-version }}
          CONTROL_VERSION: ${{ steps.version.outputs.control-version }}
        run: |
          python3 .github/scripts/check-release-version.py \
            --solution-version "${SOLUTION_VERSION}" \
            --control-version "${CONTROL_VERSION}"

      # What this run was built from, said plainly and in one place.
      #
      # `git rev-parse HEAD` rather than a context value, because it reports what
      # was actually checked out. What that commit *means* depends on the event,
      # and the difference matters:
      #
      # * pull_request — GitHub checks out a synthetic merge of the branch with
      #   current main. The commit exists nowhere else, and it is not a release
      #   candidate and never a tag target. What it proves is worth having: that
      #   the proposed branch, combined with main as it stands, packages.
      # * workflow_dispatch from main — the real release candidate. Whatever is
      #   validated in an environment is validated for this exact commit, and the
      #   final signed tag has to point at it.
      # * push of a tag — the tagged source, rebuilt for publication.
      - name: Record what this build came from
        id: provenance
        env:
          SOLUTION_VERSION: ${{ steps.version.outputs.solution-version }}
          CONTROL_VERSION: ${{ steps.version.outputs.control-version }}
        run: |
          commit=$(git rev-parse HEAD)
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"
          {
            echo "### ${SOLUTION_NAME} ${SOLUTION_VERSION}"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Source commit | \`${commit}\` |"
            echo "| Solution version | ${SOLUTION_VERSION} |"
            echo "| Control version | ${CONTROL_VERSION} |"
            echo "| Event | ${GITHUB_EVENT_NAME} |"
            echo "| Run | ${GITHUB_RUN_ID} |"
            echo
            if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
              echo "This is a **release candidate**. Whatever is validated in a"
              echo "real environment is validated for this commit: the final"
              echo "signed tag has to point at \`${commit}\`, even if main has"
              echo "moved on since."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "source commit ${commit}, solution ${SOLUTION_VERSION}, control ${CONTROL_VERSION}, event ${GITHUB_EVENT_NAME}"

      - name: Install the Power Platform CLI
        run: |
          dotnet tool install --global Microsoft.PowerApps.CLI.Tool --version "${PAC_VERSION}"
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      # Printed and checked, not assumed: a pinned version that silently resolved
      # to something else would be worth knowing about before a package is built.
      - name: Record and check the toolchain
        run: |
          node --version
          npm --version
          dotnet --version
          # `pac --version` prints the version and then exits 1: it is not a
          # command pac accepts, so it falls through to its help. `pac help`
          # prints the same banner and exits 0.
          pac help | head -2
          installed=$(pac help | sed -n 's/^Version: \([0-9.]*\).*/\1/p')
          if [ "${installed}" != "${PAC_VERSION}" ]; then
            echo "::error::pac is ${installed}, expected ${PAC_VERSION}"
            exit 1
          fi
          node_version=$(node --version)
          if [ "${node_version}" != "v${NODE_VERSION}" ]; then
            echo "::error::node is ${node_version}, expected v${NODE_VERSION}"
            exit 1
          fi
          npm_version=$(npm --version)
          if [ "${npm_version}" != "${NPM_VERSION}" ]; then
            echo "::error::npm is ${npm_version}, expected ${NPM_VERSION}"
            exit 1
          fi
          dotnet_version=$(dotnet --version)
          if [ "${dotnet_version}" != "${DOTNET_VERSION}" ]; then
            echo "::error::dotnet is ${dotnet_version}, expected ${DOTNET_VERSION}"
            exit 1
          fi

      # A tag push does not run ci.yml, so the gates run here too: a release must
      # never be cut from a commit that would have failed its pull request.
      - name: Run the quality gates
        run: |
          npm ci --prefix pcf
          # The manifest types are generated, not committed, and linting and
          # type-checking need them: without them every IInputs is an unresolved
          # type and the run drowns in unsafe-any errors. The pull request build
          # gets them from its own `npm run build`; here they are asked for
          # directly, before anything reads the sources.
          npm --prefix pcf run refreshTypes
          npm run lint
          npm run typecheck
          # Through the pcf project rather than the root wrapper. `npm test --
          # --runInBand` at the root hands the flag to the *second* npm, which
          # treats it as configuration it does not know, warns, and drops it —
          # the tests then ran in parallel while the log said otherwise.
          npm --prefix pcf run test -- --runInBand
          npm --prefix pcf run test:coverage -- --runInBand

      # What actually ships is React, Fluent and this control. A release stops if
      # an advisory reaches that, at high or worse.
      #
      # Deliberately `--omit=dev`: the build and test tooling has its own
      # advisories — today nine, four of them high, all inside `pcf-start` and
      # `pcf-scripts`, Microsoft's own harness — and none of it is in the package
      # or in a browser. Failing the release on those would be failing on
      # something no user of this control can be reached through.
      - name: Check the shipped dependencies for advisories
        working-directory: pcf
        run: npm audit --omit=dev --audit-level=high

      # Building the solution in Release configuration already builds the
      # component in production mode. It is asked for explicitly as well, so that
      # a development bundle cannot reach a package through some later change in
      # how the projects are wired together.
      - name: Build the component for production
        run: npm --prefix pcf run build -- --buildMode production

      # Read before it is packed. SolutionPackager is silent about the mistakes
      # that matter here: an entity folder no RootComponent mentions packs
      # without the table, and a non-empty <Entities /> in Customizations.xml
      # makes it drop the folder entirely. Both produce a green build and a
      # package with no database in it.
      - name: Check the solution source
        run: python3 .github/scripts/check-solution-source.py

      # Writes the solution version into the manifest that is about to be packed.
      #
      # It cannot introduce one. The step above has already proved that this is
      # the version the committed manifest declares, so this can only write back
      # what is already there. It stays because the manifest is what
      # SolutionPackager reads, and a release should put the version it was
      # checked against into that file explicitly rather than trusting that
      # nothing between here and the packer touched it.
      #
      # Everything else about the solution — unique name, publisher, packaging,
      # and the table itself — is read from the repository rather than generated
      # here.
      - name: Stamp the solution version
        env:
          SOLUTION_VERSION: ${{ steps.version.outputs.solution-version }}
        run: |
          python3 .github/scripts/stamp-solution-version.py \
            "${SOLUTION_DIR}/src/Other/Solution.xml" --version "${SOLUTION_VERSION}"

      # SolutionPackager reports a component it could not take as a line in its
      # log and still exits zero. The log is read, and the packages themselves are
      # read after that.
      - name: Pack the solution
        run: |
          set -o pipefail
          ( cd "${SOLUTION_DIR}" && dotnet build -c Release ) | tee /tmp/pack.log
          if grep -qE "will be skipped|not defined in customizations" /tmp/pack.log; then
            echo "::error::SolutionPackager skipped a component — the package is incomplete"
            grep -E "will be skipped|not defined in customizations" /tmp/pack.log
            exit 1
          fi

      - name: Collect the packages
        env:
          SOLUTION_VERSION: ${{ steps.version.outputs.solution-version }}
        run: |
          mkdir -p dist
          built="${SOLUTION_DIR}/bin/Release"
          managed="${built}/${SOLUTION_PROJECT}_managed.zip"
          unmanaged="${built}/${SOLUTION_PROJECT}.zip"
          for produced in "${managed}" "${unmanaged}"; do
            if [ ! -s "${produced}" ]; then
              echo "::error::${produced} was not produced"
              find "${SOLUTION_DIR}/bin" -type f >&2 || true
              exit 1
            fi
          done
          cp "${managed}"   "dist/${SOLUTION_NAME}_${SOLUTION_VERSION}_managed.zip"
          cp "${unmanaged}" "dist/${SOLUTION_NAME}_${SOLUTION_VERSION}.zip"
          ls -l dist
          sha256sum dist/*.zip

      # The packages are opened and read before anyone is told what they contain.
      - name: Check what was built
        env:
          SOLUTION_VERSION: ${{ steps.version.outputs.solution-version }}
          CONTROL_VERSION: ${{ steps.version.outputs.control-version }}
        run: |
          python3 .github/scripts/check-release-package.py \
            "dist/${SOLUTION_NAME}_${SOLUTION_VERSION}_managed.zip" \
            --version "${SOLUTION_VERSION}" --control-version "${CONTROL_VERSION}" --managed
          python3 .github/scripts/check-release-package.py \
            "dist/${SOLUTION_NAME}_${SOLUTION_VERSION}.zip" \
            --version "${SOLUTION_VERSION}" --control-version "${CONTROL_VERSION}" --unmanaged

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.SOLUTION_NAME }}-${{ steps.version.outputs.solution-version }}
          path: dist/*.zip
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: package
    # Every condition matters. `ref_type` alone is not enough: a run started by
    # hand can be dispatched against a tag as well as a branch, and would then
    # walk straight into publishing something nobody validated. So the event has
    # to be a push, the ref has to be a tag, and the tag has to be one of ours.
    # A manual run builds the same packages and leaves them as an artifact.
    if: >-
      github.event_name == 'push'
      && github.ref_type == 'tag'
      && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: ${{ env.SOLUTION_NAME }}-${{ needs.package.outputs.solution-version }}
          path: dist

      # A release is cut from a signed annotated tag on main, or not at all.
      #
      # The two calls are how the REST API tells the two kinds of tag apart: a
      # lightweight tag is only a reference, so its object is a commit and there
      # is no tag object to ask about. An annotated tag has one, and that object
      # is what carries the signature.
      - name: Check the tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          reference=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}")
          kind=$(printf '%s' "${reference}" | jq -r '.object.type')
          if [ "${kind}" != "tag" ]; then
            echo "::error::${TAG} is a lightweight tag; a release needs a signed annotated tag"
            exit 1
          fi

          object=$(printf '%s' "${reference}" | jq -r '.object.sha')
          tag=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${object}")
          verified=$(printf '%s' "${tag}" | jq -r '.verification.verified')
          reason=$(printf '%s' "${tag}" | jq -r '.verification.reason')
          if [ "${verified}" != "true" ]; then
            echo "::error::${TAG} is not a verified signed tag (${reason})"
            exit 1
          fi

          commit=$(printf '%s' "${tag}" | jq -r '.object.sha')
          if ! gh api "repos/${GITHUB_REPOSITORY}/compare/main...${commit}" \
                 --jq '.status' | grep -qE '^(identical|behind)$'; then
            echo "::error::${TAG} points at ${commit}, which is not on main"
            exit 1
          fi
          echo "${TAG}: annotated, signed (${reason}), on main at ${commit}"

      # No --clobber anywhere. A version that has been published is what people
      # downloaded; replacing its files later would leave two different things
      # wearing one version number. Repairing a botched publication is a decision
      # somebody makes deliberately, not something this file does quietly.
      - name: Refuse to replace a published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "::error::a release for ${TAG} already exists — published versions are not rebuilt"
            exit 1
          fi

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          SOLUTION_VERSION: ${{ needs.package.outputs.solution-version }}
          CONTROL_VERSION: ${{ needs.package.outputs.control-version }}
        run: |
          ls -l dist
          sha256sum dist/*.zip
          # What the packages are, said on the release page itself rather than
          # left to a generated changelog that only lists commits.
          cat > /tmp/notes.md <<NOTES
          **Ayonto Mention.** This package installs the Power Apps code component
          and two Dataverse tables: **\`ayonto_mention\`** and
          **\`ayonto_mentionevent\`**, the product's own event table, which is
          organization-owned.

          **It does not send notifications.** There is no server-side ingest, no
          dispatcher, no e-mail, Teams or in-app delivery in this package.
          Selecting a mention writes the bound text and the companion metadata
          onto the record being edited, and nothing else — it does **not** create
          a row in either table, because the server-side step that would do that
          is not implemented yet. Saving the record remains the only commit
          boundary.

          Solution version \`${SOLUTION_VERSION}\`, code component version
          \`${CONTROL_VERSION}\`. The two are versioned separately: a Dataverse
          solution version has four parts, and the component framework manifest
          uses Semantic Versioning.

          Two Dataverse solution packages are attached:

          * \`${SOLUTION_NAME}_${SOLUTION_VERSION}_managed.zip\` — for environments
            that are not where this control is developed.
          * \`${SOLUTION_NAME}_${SOLUTION_VERSION}.zip\` — unmanaged, for a
            development environment or to inspect the package.
          NOTES
          gh release create "${TAG}" dist/*.zip \
            --verify-tag \
            --title "${TAG}" \
            --notes-file /tmp/notes.md \
            --generate-notes
